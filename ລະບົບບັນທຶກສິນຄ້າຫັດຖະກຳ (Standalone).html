document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fffdf8;border:1px solid #e6ddc9;border-radius:12px;padding:20px;overflow:auto\">\n          <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n            <sc-raw-thead>\n              <sc-raw-tr style=\"text-align:left;border-bottom:2px solid #e6ddc9\">\n                <sc-raw-th style=\"{{thStyle}}\">ຊື່ແຫຼ່ງສິນຄ້າ<\u002Fsc-raw-th><sc-raw-th style=\"{{thStyle}}\">ຜູ້ຕິດຕໍ່<\u002Fsc-raw-th><sc-raw-th style=\"{{thStyle}}\">ໝາຍເຫດ<\u002Fsc-raw-th><sc-raw-th style=\"{{thStyle}}\"><\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{sourcesRows}}\" as=\"s\" hint-placeholder-count=\"4\">\n                <sc-raw-tr style=\"border-bottom:1px solid #f0ebdf\">\n                  <sc-raw-td style=\"{{tdStyle}}\">{{s.name}}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"{{tdStyle}}\">{{s.contact}}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"{{tdStyle}}\">{{s.note}}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"{{tdStyle}};display:flex;gap:10px\">\n                    <button sc-camel-on-click=\"{{s.onEdit}}\" style=\"{{editLinkStyle}}\">ແກ້ໄຂ<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{s.onDelete}}\" style=\"{{deleteLinkStyle}}\">ລຶບ<\u002Fbutton>\n                  <\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nfunction todayStr(){ return new Date().toISOString().slice(0,10); }\nfunction fmt(n){ return Math.round(n||0).toLocaleString('en-US'); }\n\nclass Component extends DCLogic {\n  state = {\n    role: 'admin',\n    tab: 'dashboard',\n    sources: [\n      {id:'src1', name:'C1', contact:'ບ້ານນາໄຊ', note:''},\n      {id:'src2', name:'C2', contact:'ກຸ່ມສານແມ່ຍິງ ບ້ານໂພນ', note:''},\n      {id:'src3', name:'C3', contact:'', note:''},\n      {id:'src4', name:'C4', contact:'', note:''},\n      {id:'src5', name:'C6-7-8', contact:'', note:''},\n      {id:'src6', name:'C10', contact:'', note:''}\n    ],\n    products: [\n      {id:'p1', name:'ຕິບເຂົ້າ ໄມ້ໄຜ່ ຂະໜາດນ້ອຍ', category:'ຕິບເຂົ້າ', sourceId:'src1', unit:'ອັນ'},\n      {id:'p2', name:'ຕິບເຂົ້າ ໄມ້ໄຜ່ ຂະໜາດກາງ', category:'ຕິບເຂົ້າ', sourceId:'src1', unit:'ອັນ'},\n      {id:'p3', name:'ຕິບເຂົ້າ ຫວາຍ ຂະໜາດໃຫຍ່', category:'ຕິບເຂົ້າ', sourceId:'src2', unit:'ອັນ'},\n      {id:'p4', name:'ຕິບເຂົ້າ ໄມ້ໄຜ່ ລາຍພິເສດ', category:'ຕິບເຂົ້າ', sourceId:'src5', unit:'ອັນ'}\n    ],\n    incomings: [\n      {id:'in1', date:'2026-07-05', productId:'p1', sourceId:'src1', qty:30, unit:'ອັນ', cost:25000, note:''},\n      {id:'in2', date:'2026-07-05', productId:'p2', sourceId:'src1', qty:20, unit:'ອັນ', cost:35000, note:''},\n      {id:'in3', date:'2026-07-12', productId:'p3', sourceId:'src2', qty:15, unit:'ອັນ', cost:55000, note:''},\n      {id:'in4', date:'2026-07-20', productId:'p4', sourceId:'src5', qty:10, unit:'ອັນ', cost:60000, note:'ລາຍພິເສດສັ່ງເຮັດ'},\n      {id:'in5', date:'2026-08-01', productId:'p1', sourceId:'src1', qty:20, unit:'ອັນ', cost:25000, note:''}\n    ],\n    sales: [\n      {id:'s1', date:'2026-07-10', productId:'p1', customer:'ຮ້ານ ໄມ້ຫອມ', qty:12, price:45000, note:''},\n      {id:'s2', date:'2026-07-15', productId:'p2', customer:'ຮ້ານ ໄມ້ຫອມ', qty:8, price:60000, note:''},\n      {id:'s3', date:'2026-07-22', productId:'p3', customer:'ລູກຄ້າຍ່ອຍ', qty:5, price:90000, note:''},\n      {id:'s4', date:'2026-08-02', productId:'p4', customer:'ຕົວແທນຈຳໜ່າຍ', qty:4, price:100000, note:''},\n      {id:'s5', date:'2026-08-05', productId:'p1', customer:'ຮ້ານ ໄມ້ຫອມ', qty:10, price:45000, note:''}\n    ],\n    inForm: {productId:'p1', sourceId:'src1', qty:'', unit:'ອັນ', cost:'', date: todayStr(), note:''},\n    saleForm: {productId:'p1', customer:'', qty:'', price:'', date: todayStr(), note:''},\n    sourceForm: {id:null, name:'', contact:'', note:''},\n    productForm: {id:null, name:'', category:'ຕິບເຂົ້າ', sourceId:'src1', unit:'ອັນ'}\n  };\n\n  genId(prefix){ return prefix + Date.now() + Math.floor(Math.random()*1000); }\n  updateForm(formName, field, value){ this.setState(s => ({ [formName]: { ...s[formName], [field]: value } })); }\n  setTab(id){ this.setState({tab:id}); }\n  setRole(r){\n    this.setState(s => ({ role:r, tab: (r==='staff' && (s.tab==='sources'||s.tab==='products')) ? 'dashboard' : s.tab }));\n  }\n\n  addIncoming(){\n    const f = this.state.inForm;\n    if(!f.productId || !f.qty) return;\n    const rec = {id:this.genId('in'), date:f.date||todayStr(), productId:f.productId, sourceId:f.sourceId, qty:Number(f.qty), unit:f.unit||'ອັນ', cost:Number(f.cost)||0, note:f.note};\n    this.setState(s => ({ incomings:[rec, ...s.incomings], inForm:{...s.inForm, qty:'', cost:'', note:''} }));\n  }\n  deleteIncoming(id){ this.setState(s => ({ incomings: s.incomings.filter(x => x.id!==id) })); }\n\n  addSale(){\n    const f = this.state.saleForm;\n    if(!f.productId || !f.qty || !f.price) return;\n    const rec = {id:this.genId('s'), date:f.date||todayStr(), productId:f.productId, customer:f.customer, qty:Number(f.qty), price:Number(f.price), note:f.note};\n    this.setState(s => ({ sales:[rec, ...s.sales], saleForm:{...s.saleForm, qty:'', price:'', customer:'', note:''} }));\n  }\n  deleteSale(id){ this.setState(s => ({ sales: s.sales.filter(x => x.id!==id) })); }\n\n  saveSource(){\n    const f = this.state.sourceForm;\n    if(!f.name) return;\n    this.setState(s => {\n      if(f.id){\n        return { sources: s.sources.map(x => x.id===f.id ? {...f} : x), sourceForm:{id:null,name:'',contact:'',note:''} };\n      }\n      return { sources:[...s.sources, {id:this.genId('src'), name:f.name, contact:f.contact, note:f.note}], sourceForm:{id:null,name:'',contact:'',note:''} };\n    });\n  }\n  editSource(src){ this.setState({ sourceForm:{...src} }); }\n  cancelSourceEdit(){ this.setState({ sourceForm:{id:null,name:'',contact:'',note:''} }); }\n  deleteSource(id){ this.setState(s => ({ sources: s.sources.filter(x => x.id!==id) })); }\n\n  saveProduct(){\n    const f = this.state.productForm;\n    if(!f.name) return;\n    this.setState(s => {\n      if(f.id){\n        return { products: s.products.map(x => x.id===f.id ? {...f} : x), productForm:{id:null,name:'',category:'ຕິບເຂົ້າ',sourceId:s.sources[0]?.id||'',unit:'ອັນ'} };\n      }\n      return { products:[...s.products, {id:this.genId('p'), name:f.name, category:f.category, sourceId:f.sourceId, unit:f.unit||'ອັນ'}], productForm:{id:null,name:'',category:'ຕິບເຂົ້າ',sourceId:s.sources[0]?.id||'',unit:'ອັນ'} };\n    });\n  }\n  editProduct(p){ this.setState({ productForm:{...p} }); }\n  cancelProductEdit(){ this.setState(s => ({ productForm:{id:null,name:'',category:'ຕິບເຂົ້າ',sourceId:s.sources[0]?.id||'',unit:'ອັນ'} })); }\n  deleteProduct(id){ this.setState(s => ({ products: s.products.filter(x => x.id!==id) })); }\n\n  renderVals(){\n    const s = this.state;\n    const isAdmin = s.role === 'admin';\n    const sourceById = Object.fromEntries(s.sources.map(x => [x.id, x]));\n    const productById = Object.fromEntries(s.products.map(x => [x.id, x]));\n\n    const stockMap = {};\n    s.products.forEach(p => {\n      const inQty = s.incomings.filter(i => i.productId===p.id).reduce((a,i)=>a+i.qty,0);\n      const outQty = s.sales.filter(x => x.productId===p.id).reduce((a,x)=>a+x.qty,0);\n      stockMap[p.id] = inQty - outQty;\n    });\n    const totalStock = Object.values(stockMap).reduce((a,b)=>a+b,0);\n\n    const avgCost = {};\n    s.products.forEach(p => {\n      const batch = s.incomings.filter(i => i.productId===p.id);\n      const totQty = batch.reduce((a,i)=>a+i.qty,0);\n      const totCost = batch.reduce((a,i)=>a+i.qty*i.cost,0);\n      avgCost[p.id] = totQty>0 ? totCost/totQty : 0;\n    });\n    const totalRevenue = s.sales.reduce((a,x)=>a+x.qty*x.price,0);\n    const cogs = s.sales.reduce((a,x)=>a+x.qty*(avgCost[x.productId]||0),0);\n    const totalProfit = totalRevenue - cogs;\n\n    const qtyByProduct = {};\n    s.sales.forEach(x => { qtyByProduct[x.productId] = (qtyByProduct[x.productId]||0) + x.qty; });\n    let topProductId = null, topProductQty = 0;\n    Object.entries(qtyByProduct).forEach(([pid,q]) => { if(q>topProductQty){ topProductQty=q; topProductId=pid; } });\n    const topProductName = topProductId ? (productById[topProductId]?.name || '-') : '-';\n\n    const revBySource = {};\n    s.sales.forEach(x => {\n      const p = productById[x.productId]; if(!p) return;\n      revBySource[p.sourceId] = (revBySource[p.sourceId]||0) + x.qty*x.price;\n    });\n    let salesBySourceList = Object.entries(revBySource).map(([sid,rev]) => ({name: sourceById[sid]?.name || '-', rev, revFmt: fmt(rev)}));\n    const maxSrcRev = Math.max(1, ...salesBySourceList.map(x=>x.rev));\n    salesBySourceList = salesBySourceList.map(x => ({...x, pct: Math.round(x.rev/maxSrcRev*100)})).sort((a,b)=>b.rev-a.rev);\n\n    const revByMonth = {};\n    s.sales.forEach(x => { const m = x.date.slice(0,7); revByMonth[m] = (revByMonth[m]||0) + x.qty*x.price; });\n    let salesByPeriodList = Object.entries(revByMonth).sort((a,b)=> a[0]<b[0]?-1:1).map(([m,rev]) => ({label:m, rev, revFmt: fmt(rev)}));\n    const maxMonthRev = Math.max(1, ...salesByPeriodList.map(x=>x.rev));\n    salesByPeriodList = salesByPeriodList.map(x => ({...x, pct: Math.round(x.rev/maxMonthRev*100)}));\n\n    const catMap = {};\n    s.products.forEach(p => {\n      if(!catMap[p.category]) catMap[p.category] = {category:p.category, sold:0, stock:0};\n      catMap[p.category].sold += qtyByProduct[p.id] || 0;\n      catMap[p.category].stock += stockMap[p.id];\n    });\n    const categoryStatsList = Object.values(catMap);\n\n    const stockBySrc = {};\n    s.products.forEach(p => { stockBySrc[p.sourceId] = (stockBySrc[p.sourceId]||0) + stockMap[p.id]; });\n    const stockBySourceList = Object.entries(stockBySrc).map(([sid,stock]) => ({name: sourceById[sid]?.name || '-', stock})).sort((a,b)=>b.stock-a.stock);\n\n    const lowThreshold = 8;\n    const productsWithStock = s.products.map(p => {\n      const stock = stockMap[p.id];\n      return {\n        ...p, stock,\n        sourceName: sourceById[p.sourceId]?.name || '-',\n        rowBg: stock < lowThreshold ? '#fbeee0' : 'transparent',\n        onEdit: () => this.editProduct(p),\n        onDelete: () => this.deleteProduct(p.id)\n      };\n    });\n    const lowStockList = productsWithStock.filter(p => p.stock < lowThreshold).sort((a,b)=>a.stock-b.stock);\n\n    const incomingRows = [...s.incomings].sort((a,b)=> a.date<b.date?1:-1).map(r => ({\n      ...r,\n      productName: productById[r.productId]?.name || '-',\n      sourceName: sourceById[r.sourceId]?.name || '-',\n      costFmt: fmt(r.cost),\n      onDelete: () => this.deleteIncoming(r.id)\n    }));\n    const saleRows = [...s.sales].sort((a,b)=> a.date<b.date?1:-1).map(r => ({\n      ...r,\n      productName: productById[r.productId]?.name || '-',\n      sourceName: sourceById[productById[r.productId]?.sourceId]?.name || '-',\n      priceFmt: fmt(r.price),\n      subtotalFmt: fmt(r.qty*r.price),\n      onDelete: () => this.deleteSale(r.id)\n    }));\n\n    const sourcesRows = s.sources.map(src => ({ ...src, onEdit: () => this.editSource(src), onDelete: () => this.deleteSource(src.id) }));\n\n    const tabDefs = [\n      {id:'dashboard', label:'ພາບລວມ'},\n      {id:'in', label:'ນຳເຂົ້າ'},\n      {id:'sale', label:'ຂາຍ'}\n    ];\n    if(isAdmin){ tabDefs.push({id:'products', label:'ສິນຄ້າ'}, {id:'sources', label:'ແຫຼ່ງສິນຄ້າ'}); }\n    const tabsList = tabDefs.map(t => ({\n      ...t,\n      onClick: () => this.setTab(t.id),\n      style: `padding:10px 16px;border:none;background:transparent;font-family:'Noto Sans Lao',sans-serif;font-size:15px;cursor:pointer;border-bottom:3px solid ${s.tab===t.id?'#6b4a30':'transparent'};color:${s.tab===t.id?'#4a3120':'#6b5b4a'};font-weight:${s.tab===t.id?'600':'400'}`\n    }));\n\n    const mk = (formName, field) => (e) => this.updateForm(formName, field, e.target.value);\n\n    const inputStyle = \"width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #e6ddc9;border-radius:8px;font-family:'Noto Sans Lao',sans-serif;font-size:14px;background:#fffefb;color:#2a2118\";\n    const labelStyle = \"font-size:12px;color:#6b5b4a;margin-bottom:5px\";\n    const thStyle = \"padding:8px 6px;font-size:12px;color:#6b5b4a;font-weight:600\";\n    const tdStyle = \"padding:9px 6px;color:#2a2118\";\n    const primaryBtnStyle = \"padding:10px 20px;border:none;border-radius:8px;background:#6b4a30;color:#fffdf8;font-family:'Noto Sans Lao',sans-serif;font-size:14px;font-weight:600;cursor:pointer\";\n    const secondaryBtnStyle = \"padding:10px 20px;border:1px solid #e6ddc9;border-radius:8px;background:transparent;color:#6b5b4a;font-family:'Noto Sans Lao',sans-serif;font-size:14px;cursor:pointer\";\n    const deleteLinkStyle = \"border:none;background:transparent;color:#a8433a;font-family:'Noto Sans Lao',sans-serif;font-size:13px;cursor:pointer;padding:0\";\n    const editLinkStyle = \"border:none;background:transparent;color:#5f7a52;font-family:'Noto Sans Lao',sans-serif;font-size:13px;cursor:pointer;padding:0\";\n    const roleBtn = (active) => `padding:8px 16px;border:none;border-radius:7px;font-family:'Noto Sans Lao',sans-serif;font-size:13px;cursor:pointer;background:${active?'#6b4a30':'transparent'};color:${active?'#fffdf8':'#6b5b4a'};font-weight:${active?'600':'400'}`;\n\n    return {\n      isAdmin,\n      isDashboard: s.tab==='dashboard', isIn: s.tab==='in', isSale: s.tab==='sale', isProducts: s.tab==='products', isSources: s.tab==='sources',\n      tabsList,\n      setRoleAdmin: () => this.setRole('admin'), setRoleStaff: () => this.setRole('staff'),\n      roleAdminBtnStyle: roleBtn(s.role==='admin'), roleStaffBtnStyle: roleBtn(s.role==='staff'),\n\n      totalRevenueFmt: fmt(totalRevenue), totalProfitFmt: fmt(totalProfit), totalStock,\n      topProductName, topProductQty,\n      salesBySourceList, salesByPeriodList, categoryStatsList, stockBySourceList,\n      lowStockList, hasLowStock: lowStockList.length>0, noLowStock: lowStockList.length===0,\n\n      sources: s.sources, sourcesRows, products: s.products, productsWithStock,\n      incomingRows, saleRows,\n\n      inForm: s.inForm, saleForm: s.saleForm, sourceForm: s.sourceForm, productForm: s.productForm,\n      isEditingSource: !!s.sourceForm.id, isEditingProduct: !!s.productForm.id,\n      sourceFormTitle: s.sourceForm.id ? 'ແກ້ໄຂແຫຼ່ງສິນຄ້າ' : 'ເພີ່ມແຫຼ່ງສິນຄ້າໃໝ່',\n      sourceFormBtnLabel: s.sourceForm.id ? 'ບັນທຶກການແກ້ໄຂ' : 'ເພີ່ມແຫຼ່ງສິນຄ້າ',\n      productFormTitle: s.productForm.id ? 'ແກ້ໄຂສິນຄ້າ' : 'ເພີ່ມສິນຄ້າໃໝ່',\n      productFormBtnLabel: s.productForm.id ? 'ບັນທຶກການແກ້ໄຂ' : 'ເພີ່ມສິນຄ້າ',\n\n      inProductChange: mk('inForm','productId'), inSourceChange: mk('inForm','sourceId'), inQtyChange: mk('inForm','qty'),\n      inUnitChange: mk('inForm','unit'), inCostChange: mk('inForm','cost'), inDateChange: mk('inForm','date'), inNoteChange: mk('inForm','note'),\n      saleProductChange: mk('saleForm','productId'), saleCustomerChange: mk('saleForm','customer'), saleQtyChange: mk('saleForm','qty'),\n      salePriceChange: mk('saleForm','price'), saleDateChange: mk('saleForm','date'), saleNoteChange: mk('saleForm','note'),\n      sourceNameChange: mk('sourceForm','name'), sourceContactChange: mk('sourceForm','contact'), sourceNoteChange: mk('sourceForm','note'),\n      productNameChange: mk('productForm','name'), productCategoryChange: mk('productForm','category'),\n      productSourceChange: mk('productForm','sourceId'), productUnitChange: mk('productForm','unit'),\n\n      addIncoming: () => this.addIncoming(), addSale: () => this.addSale(),\n      saveSource: () => this.saveSource(), cancelSourceEdit: () => this.cancelSourceEdit(),\n      saveProduct: () => this.saveProduct(), cancelProductEdit: () => this.cancelProductEdit(),\n\n      inputStyle, labelStyle, thStyle, tdStyle, primaryBtnStyle, secondaryBtnStyle, deleteLinkStyle, editLinkStyle\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
